name: Site CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check required files
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/css/pages.css
          test -f assets/css/characters.css
          test -f assets/css/character-profile.css
          test -f assets/js/main.js
          test -f assets/js/characters.js
          test -f assets/js/character-profile.js
          test -f pages/rem.html
          test -f pages/ram.html
          test -f pages/characters.html
          test -f pages/character.html
          test -f pages/timeline.html
          test -f pages/universe.html
          grep -qx 'rem-ram.me' CNAME
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/characters.js
          node --check assets/js/character-profile.js
      - name: Check local links and assets in every page
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const htmlFiles = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory() && !['.git','node_modules'].includes(entry.name)) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.html')) htmlFiles.push(full);
            }
          }
          walk('.');
          const missing = [];
          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            const refs = [...html.matchAll(/(?:src|href|rel="stylesheet" href)="([^"]+)"/g)].map(m => m[1]).filter(p => !p.startsWith('#') && !p.includes('://') && !p.startsWith('mailto:'));
            for (const ref of refs) {
              const target = path.resolve(path.dirname(file), ref.split('#')[0]);
              if (!fs.existsSync(target)) missing.push(file + ' -> ' + ref);
            }
          }
          if (missing.length) { console.error('Broken local references:\n' + missing.join('\n')); process.exit(1); }
          console.log('Checked ' + htmlFiles.length + ' HTML pages; all local references exist.');
          NODE
      - name: Verify interactive character directory
        run: |
          grep -q 'characterSearch' pages/characters.html
          grep -q 'characterCategory' pages/characters.html
          grep -q 'renderCharacters' assets/js/characters.js
          grep -q 'character.html?id=' assets/js/characters.js
          grep -q 'data-en=' pages/characters.html
          grep -q 'profileData' assets/js/character-profile.js
      - name: Verify bilingual homepage
        run: |
          grep -q 'data-es=' index.html
          grep -q 'data-en=' index.html
          grep -q 'setLanguage' assets/js/main.js
