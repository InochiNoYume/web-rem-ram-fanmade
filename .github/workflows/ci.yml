name: Site CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check required files
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/main.js
          test -f CNAME
          grep -qx 'rem-ram.me' CNAME
      - name: Check JavaScript syntax
        run: node --check assets/js/main.js
      - name: Check local asset references
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)="([^"]+)"/g)].map(m => m[1]).filter(p => !p.startsWith('#') && !p.includes('://') && !p.startsWith('mailto:'));
          const missing = refs.filter(p => !fs.existsSync(p));
          if (missing.length) { console.error('Missing local references:', missing.join(', ')); process.exit(1); }
          console.log('All local references exist.');
          NODE
      - name: Verify bilingual coverage
        run: |
          grep -q 'data-es=' index.html
          grep -q 'data-en=' index.html
          grep -q 'setLanguage' assets/js/main.js
